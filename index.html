<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0d1117" />
    <title>Sat-Streak Planner</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23000'/%3E%3Cpath d='M5 25 27 7' stroke='%23e00' stroke-width='3'/%3E%3C/svg%3E" />
    <script>
      // Apply night mode before first paint so the screen never flashes white.
      try { if (localStorage.getItem('satstreak.night') === '1') document.documentElement.dataset.theme = 'night'; } catch (e) {}
    </script>
  </head>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
